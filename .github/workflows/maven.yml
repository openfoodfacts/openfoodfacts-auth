name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cardinalby/export-env-action@2.2.3
        with:
          envFile: '.env'

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: openfoodfacts/openfoodfacts-auth

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        if: github.event_name != 'pull_request'
